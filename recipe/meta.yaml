{% set name = "pyee" %}
{% set version = "12.0.0" %}
# E fixture 'event_loop' not found
{% set deselect_test = " --deselect=tests/test_trio.py::test_sync_error" %}
{% set deselect_emit = " --deselect=tests/test_async.py::test_asyncio_emit" %}
{% set deselect_once_emit = " --deselect=tests/test_async.py::test_asyncio_once_emit" %}
{% set deselect_error = " --deselect=tests/test_async.py::test_asyncio_error" %}
{% set deselect_cancellation = " --deselect=tests/test_async.py::test_asyncio_cancellation" %}
{% set deselect_sync = " --deselect=tests/test_async.py::test_sync_error" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  sha256: c480603f4aa2927d4766eb41fa82793fe60a82cbfdb8d688e0d08c55a534e145

build:
  number: 0
  skip: true  # [py<310]
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  script_env:
    - SETUPTOOLS_SCM_PRETEND_VERSION={{ version }}

requirements:
  host:
    - pip
    - python
    - setuptools
    - wheel
    - setuptools-scm
  run:
    - python
    - typing_extensions


test:
  source_files:
    - tests
  imports:
    - pyee
  commands:
    - pip check
    - python -c "from importlib.metadata import version; assert(version('{{ name }}')=='{{ version }}')"
    - pytest -v tests {{ deselect_test }} {{ deselect_emit }} {{ deselect_once_emit }} {{ deselect_error }} {{ deselect_cancellation }} {{ deselect_sync }}
  requires:
    - pip
    - pytest
    - pytest-asyncio
    - pytest-trio
    - twisted

about:
  home: https://github.com/jfhbrook/pyee
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: A port of node.js's EventEmitter to python.
  description: |
    pyee supplies a EventEmitter object that is similar to the EventEmitter
    class from Node.js. It also supplies a number of subclasses with added
    support for async and threaded programming in python, such as async/await
    as seen in python 3.5+.
  doc_url: https://pyee.readthedocs.io
  dev_url: https://github.com/jfhbrook/pyee

extra:
  anaconda-services:
    ref:
      - https://anaconda.zendesk.com/agent/tickets/109074
  recipe-maintainers:
    - mxschmitt
    - kiwi0fruit
    - anaconda-services
